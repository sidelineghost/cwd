<!doctype html>
<html>
<head>

	<!--
	About this page:

	-->
	<title>Unbranding</title>
	<style>
		body {

		}
		#banner {
			width:cover;
			background-color:#007BC2;
			text-align:center;
			padding:20px;
			color:white;
			font-size:18px;
		}
		#headline {
			text-align:center;
			font-size:60px;
			margin: 100px 20% 0;
		}
		.header a {
			float:left;
			font-size:130%;
			text-align:center;
			border-radius:4px;
			padding:12px;
		}
		.header a:hover {
			text-decoration:underline;
		}
		.header-right {
			float:right;
		}
		#logo {
			float:left;
			background-image:url(assets/brandlogo.png);
			width:80px;
			height:49px;
			margin-right:30px;
			margin-left:10px;
		}
		#logo:hover {
			float:left;
			background-image:url(assets/unbrandlogo.png);
			width:80px;
			height:49px;
			margin-right:30px;
			margin-left:10px;
		}

	</style>
	
</head>
<body>

 <p id="banner" onmouseover="unbrand('banner')" onmouseout="brand('banner')"> Free shipping and free returns on US orders. Shop now.</p>
 
<div class=header>
	<div id=logo></div>
	<a>Products</a>
	<a>Bundles</a>
	<a>Plans</a>
	<a>Services</a>
	<a>Neighbors</a>
	<a>Business</a>
</div>



 <!-- <div id="logobar"></div> -->

 <h1 id="headline" onmouseover="unbrand('headline')" onmouseout="brand('headline')">The latest innovations from Ring are here.</h1>

<script>
var brandText 
var unbrandText

function unbrand(a) {
	if (a == 'banner') {
		unbrandText = "We can stalk you for cheaper than ever.";
		}
	else if (a == 'headline') {
		unbrandText = "The latest surveillance methods have arrived.";
		}
	else {unbrandText = "Nope.";};
	document.getElementById(a).innerText = unbrandText;
}

function brand(a) {
	if (a == 'banner') {
		brandText = "Free shipping and free returns on US orders. Shop now.";
		}
	else if (a == 'headline') {
		brandText = "The latest innovations from Ring are here.";
		}
	else {brandText = "Nope.";};
	document.getElementById(a).innerText = brandText;
}


</script>


</body>
</html>
